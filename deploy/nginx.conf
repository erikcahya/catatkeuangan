# Nginx di host VPS. Salin ke /etc/nginx/sites-available/catatkeuangan, ganti server_name,
# lalu aktifkan (lihat DEPLOY.md). Certbot menambahkan bagian HTTPS (port 443) sendiri.

# Batasi percobaan login: 5 per menit per alamat IP (cukup untuk satu keluarga, menyulitkan penebak kata sandi).
limit_req_zone $binary_remote_addr zone=catat_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name keuangan.contoh.com;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location = /api/auth/login {
        limit_req zone=catat_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/catatkeuangan-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/catatkeuangan-proxy.conf;
    }
}
