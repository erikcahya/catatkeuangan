# Deploy: app + postgres. Nginx (HTTPS) dipasang di host dan meneruskan ke 127.0.0.1:3000.
# Isi POSTGRES_PASSWORD di berkas .env di samping berkas ini (lihat deploy/env.example dan DEPLOY.md).
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: catatkeuangan
      POSTGRES_USER: catatkeuangan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      TZ: Asia/Jakarta
    volumes:
      # Postgres 18+ menyimpan data di bawah /var/lib/postgresql (bukan .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catatkeuangan -d catatkeuangan"]
      interval: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://catatkeuangan:${POSTGRES_PASSWORD}@db:5432/catatkeuangan
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Jakarta
    ports:
      # Hanya bisa dijangkau dari server itu sendiri; Nginx yang membuka ke internet.
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
